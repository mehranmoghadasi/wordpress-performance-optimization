# WordPress FastCGI page cache for nginx — include from your server{} block.
# Tested pattern (nginx 1.18+). Adjust paths/socket to your host.
#
# In nginx.conf (http{} context) add:
#   fastcgi_cache_path /var/cache/nginx/wp levels=1:2 keys_zone=WORDPRESS:100m inactive=60m max_size=1g;
#   fastcgi_cache_key "$scheme$request_method$host$request_uri";
#
# Then in server{}:  include /etc/nginx/snippets/wordpress-cache.conf;   (this file)

# --- Decide when to bypass the cache ---------------------------------------------------------------------------
set $skip_cache 0;

# Never cache non-GET/HEAD, query strings, or anything with a personalising cookie.
if ($request_method !~ ^(GET|HEAD)$) { set $skip_cache 1; }
if ($query_string != "")             { set $skip_cache 1; }
if ($http_cookie ~* "wordpress_logged_in_|wp-postpass_|woocommerce_items_in_cart|woocommerce_cart_hash|wp_woocommerce_session_|comment_author_") {
    set $skip_cache 1;
}

# Admin, login, cron, REST, feeds, sitemaps, previews, WooCommerce dynamic pages.
if ($request_uri ~* "/wp-admin/|/wp-login\.php|/wp-cron\.php|/xmlrpc\.php|/wp-json/|/feed/|sitemap(_index)?\.xml|/cart/|/checkout/|/my-account/|/addons/|preview=true") {
    set $skip_cache 1;
}

# --- Static assets: long cache, no PHP -------------------------------------------------------------------------
location ~* \.(css|js|jpe?g|png|gif|webp|avif|svg|ico|woff2?|ttf|otf)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    access_log off;
    try_files $uri =404;
}

# --- Deny direct access to sensitive files -----------------------------------------------------------------------
location ~* /(wp-config\.php|readme\.html|license\.txt|\.htaccess|\.htpasswd)$ { deny all; }
location ~* /(?:uploads|files)/.*\.php$ { deny all; }

# --- PHP with FastCGI cache ------------------------------------------------------------------------------------
location / {
    try_files $uri $uri/ /index.php?$args;
}

location ~ \.php$ {
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    fastcgi_pass unix:/run/php/php8.2-fpm.sock;   # adjust
    fastcgi_index index.php;

    fastcgi_cache WORDPRESS;
    fastcgi_cache_valid 200 301 302 10m;
    fastcgi_cache_bypass $skip_cache;
    fastcgi_no_cache $skip_cache;
    fastcgi_cache_use_stale error timeout updating http_500 http_503;
    fastcgi_cache_background_update on;
    fastcgi_cache_lock on;
    fastcgi_ignore_headers Cache-Control Expires Set-Cookie;   # cache decision is made by $skip_cache above
    add_header X-Cache $upstream_cache_status;                  # HIT / MISS / BYPASS — handy when debugging
}

# Purging: install the nginx-helper plugin (rtCamp) and set purge method to "delete local cache files",
# or run `find /var/cache/nginx/wp -type f -delete` from a deploy hook.
